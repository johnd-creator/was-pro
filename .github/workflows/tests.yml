name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: was_pro_test
          POSTGRES_USER: waspro_ci
          POSTGRES_PASSWORD: disposable_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waspro_ci -d was_pro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: was_pro_test
      DB_USERNAME: waspro_ci
      DB_PASSWORD: disposable_ci_password
      WASPRO_ALLOW_DESTRUCTIVE_TESTS: 'true'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The locked PhpSpreadsheet 1.x requires PHP < 8.5.
          php-version: '8.4'
          extensions: pdo_pgsql, gd, zip
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Mark and verify disposable test database
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          psql -X -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" -c "COMMENT ON DATABASE was_pro_test IS 'waspro-disposable-tests';"
          psql -X -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" -c "SELECT current_database(), inet_server_addr(), inet_server_port();"

      - name: Build Assets
        run: npm run build

      - name: Check TypeScript
        run: npm run types:check

      - name: Tests
        run: ./vendor/bin/pest
